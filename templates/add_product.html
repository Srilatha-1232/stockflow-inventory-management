
{% extends "base.html" %}

{% block title %}Add Product - StockFlow{% endblock %}

{% block content %}

<div class="form-page">

    <div class="mb-4">
        <h2 class="fw-bold">Add New Product</h2>
        <p class="text-muted">Add a new item to your inventory.</p>
    </div>

    <div class="content-card">

        <form method="POST" action="{{ url_for('add_product') }}">

            <input type="hidden" name="csrf_token"
                   value="{{ csrf_token() }}">

            <div class="row g-3">

                <div class="col-md-6">
                    <label class="form-label">Product Name *</label>
                    <input type="text" name="name"
                           class="form-control"
                           placeholder="Enter product name"
                           required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">SKU *</label>
                    <input type="text" name="sku"
                           class="form-control"
                           placeholder="Example: LAP101"
                           required>
                </div>

                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea name="description"
                              class="form-control"
                              rows="3"
                              placeholder="Enter product description"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Quantity *</label>
                    <input type="number" name="quantity"
                           class="form-control"
                           min="0" value="0" required>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Low Stock Threshold</label>
                    <input type="number" name="low_stock_threshold"
                           class="form-control"
                           min="0"
                           placeholder="Leave blank for organization default">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Cost Price (₹)</label>
                    <input type="number" name="cost_price"
                           class="form-control"
                           min="0" step="0.01"
                           placeholder="Enter cost price">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Selling Price (₹)</label>
                    <input type="number" name="selling_price"
                           class="form-control"
                           min="0" step="0.01"
                           placeholder="Enter selling price">
                </div>

            </div>

            <hr class="my-4">

            <div class="d-flex gap-2">

                <button type="submit" class="btn btn-primary">
                    Save Product
                </button>

                <a href="{{ url_for('view_products') }}"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
