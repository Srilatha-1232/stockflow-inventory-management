{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h2>Edit Product</h2>

    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="mb-3">
            <label>Product Name</label>
            <input type="text" name="name" class="form-control"
                   value="{{ product.name }}" required>
        </div>

        <div class="mb-3">
            <label>SKU</label>
            <input type="text" name="sku" class="form-control"
                   value="{{ product.sku }}" required>
        </div>

        <div class="mb-3">
            <label>Description</label>
            <textarea name="description" class="form-control">{{ product.description or '' }}</textarea>
        </div>

        <div class="mb-3">
            <label>Quantity</label>
            <input type="number" name="quantity" class="form-control"
                   min="0" value="{{ product.quantity }}" required>
        </div>

        <div class="mb-3">
            <label>Cost Price</label>
            <input type="number" name="cost_price" class="form-control"
                   min="0" step="0.01" value="{{ product.cost_price or 0 }}" required>
        </div>

        <div class="mb-3">
            <label>Selling Price</label>
            <input type="number" name="selling_price" class="form-control"
                   min="0" step="0.01" value="{{ product.selling_price or 0 }}" required>
        </div>

        <div class="mb-3">
            <label>Low Stock Threshold</label>
            <input type="number" name="low_stock_threshold" class="form-control"
                   min="0" value="{{ product.low_stock_threshold }}">
        </div>

        <button type="submit" class="btn btn-success">Update Product</button>
        <a href="{{ url_for('view_products') }}" class="btn btn-secondary">Cancel</a>
    </form>

</div>
{% endblock %}
